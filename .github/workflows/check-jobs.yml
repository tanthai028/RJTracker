name: RJ Jobs Digest

on:
  schedule:
    # 6 AM Eastern on Mondays and Thursdays (early on purpose: GitHub often starts scheduled runs late, so this usually lands before 8). Cron only speaks UTC, so both candidates are listed:
    # 10:00 UTC is 6 AM during EDT (summer), 11:00 UTC is 6 AM during EST (winter).
    # The "when" job below lets only the one that matches today's daylight-saving time through.
    - cron: "0 10 * * 1,4"
    - cron: "0 11 * * 1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = post now (next scheduled digest only shows jobs after this); resend = repost the last digest; report = rebuild the report page only, no Discord post; weekly = same as the scheduled run"
        type: choice
        options:
          - send
          - resend
          - report
          - weekly
        default: send

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run only the 6 AM Eastern schedule
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/New_York date +%Z)
          run=true
          if [ "$EVENT" = "schedule" ]; then
            case "$zone/$SCHEDULE" in
              "EDT/0 10 * * 1,4" | "EST/0 11 * * 1,4") run=true ;;
              *) run=false ;;
            esac
          fi
          echo "Eastern time is $zone, schedule '$SCHEDULE': run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Scheduled runs have no inputs, so they fall back to weekly
          MODE: ${{ inputs.mode || 'weekly' }}
        # The digest waits in outbox.json until the report page below is live
        run: python check_jobs.py --mode "$MODE" --defer-post

      - name: Commit updated job state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in previous_jobs.json last_digest.json docs; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (
            git commit -m "chore: update job state [skip ci]" &&
            git push
          )

      - name: Configure Pages
        if: hashFiles('outbox.json') != '' || inputs.mode == 'report'
        uses: actions/configure-pages@v5

      - name: Upload report site
        if: hashFiles('outbox.json') != '' || inputs.mode == 'report'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy report to GitHub Pages
        if: hashFiles('outbox.json') != '' || inputs.mode == 'report'
        uses: actions/deploy-pages@v4

      - name: Post digest to Discord
        if: hashFiles('outbox.json') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_jobs.py --post-outbox
