name: RJ Jobs Digest

on:
  schedule:
    # Mondays and Thursdays, 1 PM UTC = 9 AM EDT / 8 AM EST — covers both EST and EDT without chasing DST
    - cron: "0 13 * * 1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = post now (next scheduled digest only shows jobs after this); resend = repost the last digest; weekly = same as the scheduled run"
        type: choice
        options:
          - send
          - resend
          - weekly
        default: send

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Scheduled runs have no inputs, so they fall back to weekly
          MODE: ${{ inputs.mode || 'weekly' }}
        # The digest waits in outbox.json until the report page below is live
        run: python check_jobs.py --mode "$MODE" --defer-post

      - name: Commit updated job state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in previous_jobs.json last_digest.json docs; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (
            git commit -m "chore: update job state [skip ci]" &&
            git push
          )

      - name: Configure Pages
        if: hashFiles('outbox.json') != ''
        uses: actions/configure-pages@v5

      - name: Upload report site
        if: hashFiles('outbox.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy report to GitHub Pages
        if: hashFiles('outbox.json') != ''
        uses: actions/deploy-pages@v4

      - name: Post digest to Discord
        if: hashFiles('outbox.json') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_jobs.py --post-outbox
